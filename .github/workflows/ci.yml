name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint commit messages on this PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint PR title (used as the squash commit message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx commitlint --verbose

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=twowaymirror --cov-report=term-missing --cov-fail-under=90
      - name: Audit dependencies
        run: |
          uv export --frozen --no-emit-project --no-hashes -o requirements-audit.txt -q
          uvx pip-audit --strict --no-deps --disable-pip -r requirements-audit.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      # Unset repository variables come through as "", which is the default
      # for all three: no custom domain, and no submission notifications.
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
      TF_VAR_notify_email: ${{ vars.NOTIFY_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

      # The steps below run only on pull requests, and only once the
      # repository variables AWS_PLAN_ROLE_ARN and TF_BACKEND_BUCKET exist.
      # Pushes to main stop at fmt/init/validate: the plan role is trusted
      # by pull_request tokens only, so a main push could not assume it.
      # The role cannot write anything, which is why plan runs -lock=false.
      #
      # The plan needs the real Lambda artifact for this PR's code, since the
      # root module refuses to plan a stub without allow_stub_lambda.
      - uses: astral-sh/setup-uv@v5
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build Lambda artifact
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        working-directory: .
        run: backend/scripts/build_lambda.sh

      - name: Configure AWS credentials (read-only plan role)
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}

      - name: Write backend config
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_BACKEND_BUCKET }}"
          key          = "2wm/dev/terraform.tfstate"
          region       = "${{ vars.AWS_REGION || 'ca-central-1' }}"
          use_lockfile = true
          EOF

      - name: Terraform init (with backend)
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Terraform plan
        id: plan
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        run: terraform plan -no-color -input=false -lock=false | tee plan.txt
        continue-on-error: true

      # The PR comment is a summary only: the outcome, the "Plan:" line, and
      # the resource addresses with their actions. The full plan, which names
      # account ids, bucket names, and ARNs, stays in the job log, which only
      # collaborators can read once the repository is public.
      - name: Summarise plan
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        run: |
          {
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            grep -E '^  # .* (will be|must be) ' plan.txt | sed 's/^  //' || true
            grep -qE '^Changes to Outputs:' plan.txt && echo 'Outputs change.' || true
            grep -qiE '^(Error|╷)' plan.txt && echo 'Plan reported errors; see the job log.' || true
          } > plan-summary.txt
          if [ ! -s plan-summary.txt ]; then echo 'No changes.' > plan-summary.txt; fi

      - name: Post plan summary to PR
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, 'infra', 'plan-summary.txt');
            let summary = 'No summary found.';
            try {
              summary = fs.readFileSync(summaryPath, 'utf8').trim();
            } catch (err) {
              summary = `Failed to read the plan summary: ${err.message}`;
            }
            const outcome = '${{ steps.plan.outcome }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `#### Terraform plan: \`${outcome}\``,
              '',
              '```',
              summary,
              '```',
              `Full plan in the [job log](${runUrl}).`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if plan failed
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != '' && steps.plan.outcome == 'failure'
        run: exit 1
