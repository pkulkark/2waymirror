<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F7A4E; text-decoration: none; }
    a:hover { color: #256640; text-decoration: underline; }
    .serif { font-family: "Newsreader", Georgia, serif; }
    .sans { font-family: "Source Sans 3", system-ui, sans-serif; }
    .surface { background: #FFFFFF; border: 1px solid #DCE0D8; border-radius: 12px; box-sizing: border-box; }
    .skel-dark { background: #2A3936; border-radius: 6px; }
    .skel { background: #E3E6E0; border-radius: 6px; }
  </style>
</helmet>

<div style="width:1280px; min-height:900px; background:#E3E7E1; color:#171512; box-sizing:border-box; display:flex; flex-direction:column; gap:0;">

  <!-- App bar, one dark block, real fill and height, skeleton content -->
  <div style="background:#14211F; display:flex; flex-direction:column; align-items:center; gap:0; box-sizing:border-box;">

    <!-- Row 1, identity and chips -->
    <div style="width:960px; height:56px; display:flex; align-items:center; justify-content:space-between; gap:24px; box-sizing:border-box;">
      <div class="skel-dark" style="width:140px; height:20px;"></div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="skel-dark" style="width:160px; height:28px; border-radius:999px;"></div>
        <div class="skel-dark" style="width:160px; height:28px; border-radius:999px;"></div>
      </div>
    </div>

    <!-- Row 2, headline -->
    <div style="width:960px; padding:0 0 16px 0; display:flex; flex-direction:column; align-items:flex-start; gap:10px; box-sizing:border-box;">
      <div class="skel-dark" style="width:360px; height:15px;"></div>

      <!-- Row 3, links -->
      <div style="display:flex; align-items:center; gap:20px;">
        <div class="skel-dark" style="width:70px; height:15px;"></div>
        <div class="skel-dark" style="width:70px; height:15px;"></div>
        <div class="skel-dark" style="width:70px; height:15px;"></div>
      </div>
    </div>

    <!-- Row 4, tabs -->
    <div style="width:960px; height:44px; display:flex; align-items:center; gap:32px; box-sizing:border-box;">
      <div class="skel-dark" style="width:90px; height:15px;"></div>
      <div class="skel-dark" style="width:90px; height:15px;"></div>
      <div class="skel-dark" style="width:120px; height:15px;"></div>
    </div>

  </div>

  <!-- Page body -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:0;">
    <div style="width:960px; padding-top:24px; padding-bottom:40px; display:flex; flex-direction:column; gap:24px; box-sizing:border-box;">

      <!-- Logistics surface, skeleton -->
      <div class="surface" style="display:flex; flex-direction:column; gap:0;">
        <div style="height:52px; background:#E6F1EA; border-radius:11px 11px 0 0; padding:0 36px; display:flex; align-items:center; box-sizing:border-box;">
          <div class="skel" style="width:200px; height:24px;"></div>
        </div>
        <div style="padding:28px 36px 36px 36px; display:flex; flex-direction:column; gap:0; box-sizing:border-box;">
          <div style="display:flex; flex-direction:column; gap:8px; padding:14px 0 14px 0;">
            <div class="skel" style="width:90px; height:12px;"></div>
            <div class="skel" style="width:320px; height:16px;"></div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; padding:14px 0 14px 0; border-top:1px solid #E6E3DC;">
            <div class="skel" style="width:90px; height:12px;"></div>
            <div class="skel" style="width:320px; height:16px;"></div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; padding:14px 0 14px 0; border-top:1px solid #E6E3DC;">
            <div class="skel" style="width:90px; height:12px;"></div>
            <div class="skel" style="width:320px; height:16px;"></div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; padding:14px 0 14px 0; border-top:1px solid #E6E3DC;">
            <div class="skel" style="width:90px; height:12px;"></div>
            <div class="skel" style="width:320px; height:16px;"></div>
          </div>
        </div>
      </div>

      <!-- Initial conversation surface, skeleton -->
      <div class="surface" style="display:flex; flex-direction:column; gap:0;">
        <div style="height:52px; background:#E6F1EA; border-radius:11px 11px 0 0; padding:0 36px; display:flex; align-items:center; box-sizing:border-box;">
          <div class="skel" style="width:200px; height:24px;"></div>
        </div>
        <div style="padding:28px 36px 36px 36px; display:flex; flex-direction:column; gap:12px; box-sizing:border-box;">
          <div class="skel" style="width:680px; height:14px;"></div>
          <div class="skel" style="width:660px; height:14px;"></div>
          <div class="skel" style="width:640px; height:14px;"></div>
          <div class="skel" style="width:600px; height:14px;"></div>
          <div class="skel" style="width:620px; height:14px;"></div>
          <div class="skel" style="width:400px; height:14px;"></div>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
