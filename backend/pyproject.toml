[project]
name = "twowaymirror"
version = "0.1.0"
description = "2WayMirror backend: session API for reverse screening"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "typer>=0.13",
]

[project.scripts]
2wm = "twowaymirror.cli:app"

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "moto[dynamodb,s3]>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[dynamodb,s3]>=1.35",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twowaymirror"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["twowaymirror"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
